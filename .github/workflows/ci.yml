name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gateway
        run: pnpm --filter gateway build

      - name: Build traveler-web
        run: pnpm --filter traveler-web build

      - name: Build merchant-console
        run: pnpm --filter merchant-console build

      - name: Build ops-console
        run: pnpm --filter ops-console build

      - name: Frontend deploy dry-run
        env:
          STORAGE_BUCKET: gs://replace-me
          CDN_BASE_URL: https://cdn.example.com
          RELEASE_TAG: ci-dry-run
        run: bash infra/scripts/deploy_frontend.sh --dry-run

      - name: Frontend rollback dry-run
        env:
          STORAGE_BUCKET: gs://replace-me
          ROLLBACK_TO: ci-dry-run
        run: bash infra/scripts/rollback_frontend.sh --dry-run

      - name: Build gateway docker image
        run: docker build -f services/gateway/Dockerfile -t shenzhen-nexus/gateway:ci .

      - name: Validate Cloud Run manifest
        run: test -f infra/deployment/cloudrun-gateway.yaml

      - name: Run unit tests
        run: pnpm --filter traveler-web test --run

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm --filter e2e test
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:3001
